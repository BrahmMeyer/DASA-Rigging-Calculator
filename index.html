<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASA Heavy Lift Engineering & Rigging Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <header class="bg-slate-950 border-b border-slate-800 py-6 px-8">
        <h1 class="text-2xl font-bold text-white">DASA Rigging Engineering Matrix</h1>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10 space-y-10">

        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4">Phase 1: Equipment & Fleet Matcher</h2>
            <div id="craneFleetCheckboxGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </section>

        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-6">Phase 2: Member Entry</h2>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-5 items-end">
                <input type="text" id="profileName" placeholder="Profile (e.g. 254x146 UB)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <input type="number" id="memberLength" step="0.01" placeholder="Length (m)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <input type="number" id="memberQty" value="1" min="1" max="10" placeholder="Qty" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <button onclick="addComponentToBOM()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg text-sm">Add to BOM</button>
            </div>
        </section>

        <section class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between">
                <h2 class="text-sm font-bold text-white">Phase 3: Structural BOM</h2>
                <span id="bomCountBadge" class="text-xs text-slate-400">0 Items</span>
            </div>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-slate-900 text-slate-400 text-[10px] uppercase">
                        <th class="py-3 px-4">Piece #</th>
                        <th class="py-3 px-4">Designation</th>
                        <th class="py-3 px-4">Mass</th>
                        <th class="py-3 px-4">COG Data</th>
                    </tr>
                </thead>
                <tbody id="bomTableBody" class="divide-y divide-slate-800"></tbody>
            </table>
        </section>

        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4">Phase 3.5: AI Hand Sketch Vision</h2>
            <input type="file" id="sketchFileInput" accept="image/*" class="hidden" onchange="previewSketch(event)">
            <label for="sketchFileInput" class="block border-2 border-dashed border-slate-800 rounded-xl p-10 text-center cursor-pointer hover:border-amber-500">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-600"></i>
                <p class="text-xs mt-2">Upload Sketch (AI will calculate COG)</p>
            </label>
            <img id="sketchImageDisplay" src="#" class="hidden max-h-48 mx-auto mt-4 rounded">
        </section>
    </main>

    <script>
        const craneFleetDataset = [
            { id: "c1", name: "Terex Demag 160t" },
            { id: "c2", name: "Grove 190t" },
            { id: "c3", name: "Terex 60t" },
            { id: "c4", name: "Terex 30t" },
            { id: "c5", name: "XCMG 170t" }
        ];

        window.onload = () => {
            const grid = document.getElementById('craneFleetCheckboxGrid');
            grid.innerHTML = craneFleetDataset.map(c => `
                <label class="flex items-center gap-2 text-xs bg-slate-900 p-2 rounded border border-slate-800 hover:border-amber-500 transition-colors cursor-pointer">
                    <input type="checkbox" class="accent-amber-500"> ${c.name}
                </label>`).join('');
        };

        let stagedBOMMembers = [];

        function addComponentToBOM() {
            const profile = document.getElementById('profileName').value;
            const length = parseFloat(document.getElementById('memberLength').value);
            const qty = parseInt(document.getElementById('memberQty').value);
            
            if (profile && length > 0) {
                const totalMass = (length * 50) * qty; 
                stagedBOMMembers.push({
                    id: Date.now(),
                    labelKey: `Piece #${stagedBOMMembers.length + 1} (x${qty})`,
                    designation: profile,
                    calculatedMass: totalMass,
                    cog_left_m: null
                });
                renderBOMTable();
            }
        }

        function renderBOMTable() {
            const tbody = document.getElementById('bomTableBody');
            tbody.innerHTML = stagedBOMMembers.map(m => `
                <tr class="hover:bg-slate-900/50">
                    <td class="py-3 px-4 font-bold text-amber-400">${m.labelKey}</td>
                    <td class="py-3 px-4">${m.designation}</td>
                    <td class="py-3 px-4">${m.calculatedMass.toFixed(2)} kg</td>
                    <td class="py-3 px-4 text-[9px] text-slate-600 italic">Pending AI Analysis</td>
                </tr>`).join('');
            document.getElementById('bomCountBadge').innerText = `${stagedBOMMembers.length} Items`;
        }

        function previewSketch(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('sketchImageDisplay').src = ev.target.result;
                document.getElementById('sketchImageDisplay').classList.remove('hidden');
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    </script>
</body>
</html>
