<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DASA Heavy Lift Engineering & Rigging Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <header class="bg-slate-950 border-b border-slate-800 p-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-amber-500 p-3 rounded-xl text-slate-950 font-black text-xl">DASA</div>
            <div>
                <h1 class="text-xl font-bold">Heavy Lift Engineering & Rigging Planner</h1>
                <p class="text-xs text-slate-400">Integrated Asset & Crane Fleet Control System</p>
            </div>
        </div>
        <div class="text-emerald-400 font-bold border border-emerald-900 px-4 py-2 rounded-lg bg-emerald-900/10">SYSTEM ONLINE</div>
    </header>
    <main class="max-w-7xl mx-auto p-6 space-y-8">
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-amber-500 font-bold mb-4"><i class="fa-solid fa-truck-ramp-box"></i> Phase 1: Asset Manifest</h2>
                <select id="beamProfile" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 mb-4"></select>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="beamLen" placeholder="Length (m)" class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <button onclick="addInventory()" class="bg-amber-600 hover:bg-amber-500 font-bold rounded-xl">ADD MEMBER</button>
                </div>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-cyan-500 font-bold mb-4"><i class="fa-solid fa-gears"></i> Crane Fleet Registry</h2>
                <div id="fleetContainer" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar"></div>
            </div>
        </section>
        
        <section class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">Phase 2: Beam Structural Inventory</h2>
                <div class="text-right">
                    <div class="text-[10px] text-slate-400 uppercase">Total BOM</div>
                    <div id="bomWeight" class="text-xl font-black text-amber-400">0 kg</div>
                </div>
            </div>
            <table class="w-full text-left text-sm">
                <thead><tr class="text-slate-500 uppercase text-[10px]"><th class="p-3">Sel</th><th class="p-3">ID</th><th class="p-3">Mass</th></tr></thead>
                <tbody id="inventoryBody" class="divide-y divide-slate-800"></tbody>
            </table>
        </section>
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-lg font-bold mb-4">Phase 3: Capacity Clearance</h2>
                <div id="clearanceGrid" class="grid grid-cols-2 gap-2 text-xs"></div>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-lg font-bold mb-4">Phase 4: AI Sketch Analysis</h2>
                <input type="file" id="sketchUpload" class="w-full p-2 bg-slate-900 rounded-xl mb-4">
                <button onclick="analyzeSketch()" class="w-full bg-indigo-600 p-3 rounded-xl font-bold">RUN AI VISION ANALYSIS</button>
            </div>
        </section>
        <script>
        const FLEET = [
            { name: "Demag AC 160-2", cap: 200000 },
            { name: "Grove RT890E", cap: 81600 },
            { name: "XCMG QY70K-I", cap: 70000 },
            { name: "Terex T560-1", cap: 54400 },
            { name: "Terex RT230", cap: 27200 }
        ];
        let inv = [];

        function init() {
            const cont = document.getElementById('fleetContainer');
            FLEET.forEach(c => cont.innerHTML += `<label class="flex items-center gap-2 text-sm"><input type="checkbox" checked value="${c.cap}"> ${c.name} (${c.cap/1000}t)</label>`);
        }

        function addInventory() {
            inv.push({ id: inv.length + 1, mass: 5000 });
            render();
        }

        function render() {
            const body = document.getElementById('inventoryBody');
            body.innerHTML = inv.map(i => `<tr><td class="p-3"><input type="checkbox" onchange="calculate()"></td><td class="p-3">#${i.id}</td><td class="p-3">${i.mass} kg</td></tr>`).join('');
            document.getElementById('bomWeight').innerText = inv.reduce((s,i) => s + i.mass, 0).toLocaleString() + " kg";
        }

        function calculate() { /* Logic for dual weight output */ }
        function analyzeSketch() { alert("Vision AI: Analyzing rigging geometry..."); }
        function generateReport() { alert("Generating DASA Engineering Manifest..."); }
        window.onload = init;
    </script>
</body>
</html>
