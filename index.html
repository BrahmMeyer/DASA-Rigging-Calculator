<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DASA Heavy Lift Engineering & Rigging Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <header class="bg-slate-950 border-b border-slate-800 p-6 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="bg-amber-500 p-3 rounded-xl text-slate-950 font-black text-xl">DASA</div>
            <div>
                <h1 class="text-xl font-bold">Heavy Lift Engineering & Rigging Planner</h1>
                <p class="text-xs text-slate-400">Integrated Asset & Crane Fleet Control System</p>
            </div>
        </div>
        <div class="text-emerald-400 font-bold border border-emerald-900 px-4 py-2 rounded-lg bg-emerald-900/10">SYSTEM ONLINE</div>
    </header>
    <main class="max-w-7xl mx-auto p-6 space-y-8">
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-amber-500 font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-truck-ramp-box"></i> Phase 1: Asset Manifest</h2>
                <select id="beamProfile" onchange="updateMemberOptions()" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 mb-4"></select>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="beamLen" placeholder="Length (m)" class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <button onclick="addInventory()" class="bg-amber-600 hover:bg-amber-500 font-bold rounded-xl">ADD MEMBER</button>
                </div>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-cyan-500 font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-gears"></i> Crane Fleet Registry</h2>
                <div id="fleetContainer" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar"></div>
            </div>
        </section>
        
        <section class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-lg font-bold mb-4">Phase 2: Beam Structural Inventory</h2>
            <table class="w-full text-left">
                <thead class="text-slate-500 text-xs uppercase"><tr><th class="p-3">Select</th><th class="p-3">ID</th><th class="p-3">Mass (kg)</th></tr></thead>
                <tbody id="inventoryBody" class="divide-y divide-slate-800"></tbody>
            </table>
        </section>
        <section class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-lg font-bold mb-4">Phase 4: Assembled Sketch Rigging (AI)</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="space-y-3">
                    <input type="file" id="sketchUpload" class="w-full text-xs">
                    <button onclick="analyzeSketch()" class="w-full bg-indigo-600 p-3 rounded-xl font-bold">RUN AI VISION ANALYSIS</button>
                </div>
                <div id="sketchResult" class="md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-800 text-sm"></div>
            </div>
        </section>
        <script>
        const FLEET = [
            { name: "Terex Demag AC 160-2", cap: 200000 },
            { name: "Terex RT230", cap: 27200 },
            { name: "Grove RT890E", cap: 81600 },
            { name: "Terex T560-1", cap: 54400 },
            { name: "XCMG QY70K-I", cap: 70000 }
        ];
        let inventory = [];

        function init() {
            const cont = document.getElementById('fleetContainer');
            FLEET.forEach(c => cont.innerHTML += `<label class="flex items-center gap-2 text-sm"><input type="checkbox" checked value="${c.cap}"> ${c.name}</label>`);
        }

        function addInventory() {
            const id = inventory.length + 1;
            inventory.push({ id, mass: 5000 });
            render();
        }

        function render() {
            const body = document.getElementById('inventoryBody');
            body.innerHTML = inventory.map(item => `<tr><td class="p-3"><input type="checkbox" onchange="calculate()"></td><td class="p-3">#${item.id}</td><td class="p-3">${item.mass} kg</td></tr>`).join('');
        }

        function calculate() { /* Combined Weight Logic */ }

        window.onload = init;
    </script>
</body>
</html>
