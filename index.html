<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASA Heavy Lift Engineering & Rigging Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <header class="bg-slate-950 border-b border-slate-800 py-6 px-8">
        <h1 class="text-2xl font-bold text-white">DASA Rigging Engineering Matrix</h1>
        <p class="text-xs text-slate-400">SITE OPERATIONS & AI VISION INTEGRATION</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10 space-y-10">

        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4">Phase 1: Equipment & Fleet Matcher</h2>
            <div id="craneFleetCheckboxGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4">Phase 2: Member Entry</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <select id="codeFamily" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <option value="BSI">BSI / British Standards</option>
                    <option value="SANS">SANS / South African</option>
                </select>
                <input type="text" id="profileName" placeholder="Profile Designation" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <input type="number" id="memberLength" placeholder="Length (m)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <select id="memberQty" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <option value="1">Qty: 1</option><option value="5">Qty: 5</option><option value="10">Qty: 10</option>
                </select>
            </div>
            <button onclick="addComponentToBOM()" class="mt-4 bg-amber-500 hover:bg-amber-600 text-slate-950 px-6 py-2 rounded-lg font-bold text-sm w-full">Add to Pipeline</button>
        </section>

        <section class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px]">
                    <tr><th class="py-3 px-4">Piece #</th><th class="py-3 px-4">Designation</th><th class="py-3 px-4">Mass</th><th class="py-3 px-4">COG Data</th></tr>
                </thead>
                <tbody id="bomTableBody" class="divide-y divide-slate-800"></tbody>
            </table>
        </section>

        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4">Phase 3.5: AI Hand Sketch Vision</h2>
            <input type="file" id="sketchFileInput" accept="image/*" class="hidden" onchange="previewSketch(event)">
            <label for="sketchFileInput" class="block border-2 border-dashed border-slate-800 rounded-xl p-10 text-center cursor-pointer hover:border-amber-500">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-600"></i>
            </label>
            <img id="sketchImageDisplay" src="#" class="hidden max-h-48 mx-auto mt-4 rounded">
        </section>

    </main>

    <script>
        const craneFleetDataset = [
            { id: "c1", name: "Liebherr LTM 1100" }, { id: "c2", name: "Liebherr LTM 1200" },
            { id: "c3", name: "Grove GMK5250L" }, { id: "c4", name: "Sany SCC1500A" }
        ];

        window.onload = () => {
            const grid = document.getElementById('craneFleetCheckboxGrid');
            grid.innerHTML = craneFleetDataset.map(c => `
                <label class="flex items-center gap-2 text-xs bg-slate-900 p-2 rounded border border-slate-800">
                    <input type="checkbox"> ${c.name}
                </label>`).join('');
        };

        let stagedBOMMembers = [];

        function addComponentToBOM() {
            const profile = document.getElementById('profileName').value;
            const length = parseFloat(document.getElementById('memberLength').value);
            const qty = parseInt(document.getElementById('memberQty').value);
            
            if (profile && length > 0) {
                const totalMass = (length * 50) * qty; 
                stagedBOMMembers.push({
                    labelKey: `Piece #${stagedBOMMembers.length + 1} (x${qty})`,
                    designation: profile,
                    calculatedMass: totalMass,
                    cog_left_m: null, cog_right_m: null
                });
                renderBOMTable();
            }
        }

        function renderBOMTable() {
            const tbody = document.getElementById('bomTableBody');
            tbody.innerHTML = stagedBOMMembers.map(m => `
                <tr class="hover:bg-slate-900/50">
                    <td class="py-3 px-4 font-bold text-amber-400">${m.labelKey}</td>
                    <td class="py-3 px-4">${m.designation}</td>
                    <td class="py-3 px-4">${m.calculatedMass.toFixed(2)} kg</td>
                    <td class="py-3 px-4 text-xs italic text-slate-600">${m.cog_left_m ? 'COG Analyzed' : 'Pending AI'}</td>
                </tr>`).join('');
        }

        function previewSketch(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('sketchImageDisplay').src = ev.target.result;
                document.getElementById('sketchImageDisplay').classList.remove('hidden');
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    </script>
</body>
</html>
